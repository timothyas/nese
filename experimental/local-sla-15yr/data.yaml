source:
  name: cmems_l3_sla
  time:
    start: 2000-01-01
    end: 2015-12-31
    freq: 24h
  variables:
    - sla_filtered
  groups:
    - topex_poseidon
    - ers_2
    - gfo
    - jason_1
    - envisat
    - topex_poseidon_interleaved
    - jason_2
    - jason_1_interleaved
    - cryosat_2
    - envisat_new_orbit
    - jason_1_geodetic
    - saral
    - haiyang_2a
    # Only available during validation period, skip for now to avoid potential nan issues
    #- saral_geodetic

transforms:
  bin_to_healpix:
    hpx_level: 6
    ordering_nested: true
    sparse: false
    binning:
      method: gaussian_kernel
      kernel_length: null

target:
  name: anemoi
  store_dir: ${oc.env:PWD}/anemoi-hpx6-24h
  store_float64_as_float32: true
  compression: blosc_zstd
  statistics_period:
    start: 2000-01-01T00
    end: 2014-12-31T23

logistics:
  use_mpi: true
