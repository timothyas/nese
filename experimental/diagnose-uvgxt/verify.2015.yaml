forecast:
  store_dir: runs/v3/${oc.env:NESE_RUN_ID}/inference-2015
verification:
  dataset: anemoi-hpx6-24h-v3/dataset.zarr
  observations:
    sla:
      observed_as: sla_filtered
      groups: auto
      count: "sla_count_{group}"
    uvgxt:
      components: ["ugxt", "vgxt"]
      groups: auto
      count: "uvgxt_count_{group}"

metrics:
  split:
    - seen_at_hour

movie:
  date_range:
    start: 2015-05-01T12
    end: 2015-06-30T12
  loop: t0
  fhr: 24
  left_panel: all_input_obs_locations
  regions:
    - global
    - tropical_pacific

styles:
  uvgxt:
    vmin: 0
