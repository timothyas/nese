debugging_info:
  root_dir: runs/v3
  run_id: 109b3e86564e43d38f2d86603f5fb008
checkpoint: ${debugging_info.root_dir}/checkpoint/${debugging_info.run_id}/inference-last.ckpt

# multistep_input: 3
# so start is first day with all inputs in validation period
date_range:
  start: 2015-01-03T12
  end: 2015-12-31T12
  freq: 24h

output:
  netcdf: ${debugging_info.root_dir}/inference-validation/${date}.nc
lead_time: 24h
allow_nans: true
initial_state_categories: [dynamic_forcings]
precision: "32"
device: cpu

input:
  dataset:
    join:
      - dataset: anemoi-hpx6-24h/dataset.zarr
      - dataset: anemoi-hpx6-24h/dataset.zarr
        select:
          - sla_filtered_jason_2
        rename:
          sla_filtered_jason_2: sla
