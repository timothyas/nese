time:
  start: 2000-01-01
  end: 2015-12-31
  freq: 24h

sources:
  - name: cmems_l3_sla
    variables:
      - sla_filtered
    groups:
      - topex_poseidon
      - ers_2
      - gfo
      - jason_1
      - envisat
      - topex_poseidon_interleaved
      - jason_2
      - jason_1_interleaved
      - cryosat_2
      - envisat_new_orbit
      - jason_1_geodetic
      - saral
      - haiyang_2a
      # Only available during validation period,
      # skip because this would create NaNs, since
      # max normalization of the obs_count results in
      # a divide-by-zero situation ...
      #- saral_geodetic
    transforms:
      bin_to_healpix:
        hpx_level: 6
        ordering_nested: true
        sparse: false
        binning:
          method: gaussian_kernel
          kernel_length: null
  - name: gebco
    variables:
      - elevation
      - land_fraction
    options:
      uri: /Users/timith/work/nese-dataprep/data/GEBCO_2026.nc
    transforms:
      regrid_to_healpix:
        hpx_level: 6

computed_quantities:
  - cos_latitude
  - sin_latitude
  - cos_longitude
  - sin_longitude
  - cos_julian_day
  - sin_julian_day
  - insolation

target:
  name: anemoi
  store_dir: ${oc.env:PWD}/anemoi-hpx6-24h
  store_float64_as_float32: true
  compression: blosc_zstd
  statistics_period:
    start: 2000-01-01T00
    end: 2014-12-31T23

logistics:
  use_mpi: true
