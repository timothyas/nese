forecast:
  store_dir: runs/v2p1/inference-2015
verification:
  dataset: anemoi-hpx8-24h/dataset.zarr
  observations:
    sla:
      observed_as: sla_filtered
      groups: auto
      count: "sla_filtered_count_{group}"
    uvgxt:
      components: ["ugxt", "vgxt"]
      groups: auto
      count: "uvgxt_count_{group}"
    swh:
      observed_as: swh_denoised
      groups: auto
      count: "swh_denoised_count_{group}"

metrics:
  split:
    - seen_at_hour

movie:
  date_range:
    start: 2015-05-01T12
    end: 2015-05-31T12
  loop: t0
  fhr: 24
  left_panel: all_input_obs_locations
  regions:
    - global
    - tropical_pacific
    - north_atlantic
    - gulf_stream
