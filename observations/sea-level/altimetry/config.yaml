source:
  name: cmems_l3_sla
  time:
    start: 2019-01-01
    end: 2019-01-03
    freq: 24h
  variables:
    - sla_filtered
  groups:
    - jason_3
    - cryosat_2

transforms:
  bin_to_healpix:
    hpx_level: 6
    ordering_nested: true
    sparse: false
    binning:
      method: gaussian_kernel
      kernel_length: null

target:
  name: base
  path: ${oc.env:PWD}/data/hpx6
  rename: null
  precision:
  store_float64_as_float32: true
  compression: blosc_zstd

logistics:
  cache_dir: ${oc.env:PWD}/cache
  log_dir: ${target.path}/logs

attrs:
  something: good
