# nese-anemoi: the anemoi package suite plus a thin nese layer for training and inference.
#
# Every dependency of the editable packages is resolved here by conda-forge, so the editable
# installs run with --no-deps and pip never re-resolves or replaces a preexisting PyTorch
# (installing anemoi-core with deps drags in a pip torch wheel over the conda one, and its
# bundled OpenMP then aborts python on import -- see nese-dataprep/docs/installation.md).
#
#   conda env create -f environment/environment-anemoi.yaml
#   conda activate nese-anemoi
#   pip install --no-deps --no-build-isolation -e $WORK/anemoi-core/graphs
#   pip install --no-deps --no-build-isolation -e $WORK/anemoi-core/models
#   pip install --no-deps --no-build-isolation -e $WORK/anemoi-core/training
#   pip install --no-deps -e $WORK/nese-logistics
#   pip install --no-deps -e $WORK/nese-inference
#   pip install --no-deps -e $WORK/nese/training
#
# i.e., anemoi-core is installed editable, and the siblings are pulled from conda.
#
# The pytorch build string is left unpinned on purpose:
# conda-forge resolves a CPU build on Mac for local experiments, and a
# CUDA build on a GPU HPC host from the same spec. anemoi-transform pins pandas<3, so this
# env resolves to pandas 2.x and is kept separate from `nese`.
name: nese-anemoi
channels:
  - conda-forge
  - nodefaults  # conda-forge only, otherwise can get zarr/numcodecs issues
dependencies:
  - python=3.13  # anemoi-core requires <3.14
  # anemoi suite
  - anemoi-inference=0.11.2
  - anemoi-datasets=0.5.41
  - anemoi-transform
  - anemoi-utils
  # PyTorch stack -- deps of the editable anemoi-core packages, pinned to their version
  # intersection. No build string (see header).
  - pytorch>=2.3,<2.11
  - torchvision>=0.18
  - pytorch-lightning>=2.1
  - pytorch_geometric>=2.5  # conda-forge name for torch-geometric; pure-python, and >=2.5
                            # has the native knn/radius so torch_cluster is not needed
  - torchinfo>=1.8
  - timm>=0.9.2
  - einops>=0.6.1
  # other anemoi-core deps
  - hydra-core>=1.3
  - numba
  - nvidia-ml-py>=13.580.82
  - tqdm>=4.65
  - jinja2>=3.1
  - rich
  - typeguard>=4
  - networkx>=3.1
  - plotly>=5.19
  - scikit-learn>=1.5
  - numpy
  - scipy
  - pydantic>=2.9
  - omegaconf
  - zarr<3
  - numcodecs<0.16  # anemoi-datasets pin
  - healpy  # anemoi-graphs[healpix] and the nese-training HEALPix meshes
  - matplotlib
  # anemoi-utils extras (mlflow + provenance + text) used by training and inference
  - mlflow-skinny>=2.11.1
  - gitpython
  - requests
  - termcolor
  - wcwidth
  # nese-inference runtime
  - pandas  # unpinned: anemoi-transform is what forces <3, keep that visible
  - xarray
  - pyyaml
  - netCDF4
  - dask-core  # only dask.array (the preallocated zarr container); the 'dask' meta
               # pulls distributed+bokeh+pyarrow
  # nese-logistics: one rank per initial condition in a nese-inference sweep.
  # MPICH, as `environment.yaml` does -- more reliable on the macOS dev machine.
  - mpich
  - mpi4py
  # jupyter and plotting
  - jupyter
  - ipython
  - ipykernel
  - jupyterlab_vim
  - cartopy
  - cmocean
  - seaborn
  - ffmpeg
  # docs
  - sphinx
  - myst-parser
  - sphinx-book-theme
  # developer
  - setuptools_scm>=8
  - pytest
  - coverage
  - ruff=0.15.20
  - pre-commit
  # anemoi-core [tests] extras (graphs, models, training); azure-ai-ml brings marshmallow,
  # which training/pytest.ini imports
  - hypothesis
  - pytest-mock
  - pytest-asyncio
  - trimesh
  - azure-ai-ml
  - azure-identity
  - strenum
  - wandb
  - aiohttp
  - sshfs
  - boto3  # anemoi-utils[s3]
  - datashader
  - distinctipy
  - pyshtools
  - pip
  - pip:
    - nvsmi  # anemoi-utils[provenance]; not on conda-forge
    - torch-dct  # anemoi-models[spectral]
    - azureml-mlflow
    - pytest-skip-slow
    - xmovie @ git+https://github.com/timothyas/xmovie.git@b6a36ab8b4e5abcaea23a50e79b61f1ef26ca0ba
