[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nese-training"
version = "0.1.0"
description = "Observation-supervised state estimation on anemoi-core"
requires-python = ">=3.11"
dependencies = ["anemoi-training"]

[tool.setuptools.packages.find]
where = ["src"]
